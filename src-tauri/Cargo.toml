[package]
name = "app"
version = "1.0.0"
description = "Instant 1-click Windows IP and DNS profile switcher with fail-safe rollback. Built with Tauri v2, Rust, and React 19."
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "6.0"
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_IO",
] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"

[profile.release]
opt-level = "z"     # Tối ưu kích thước nhị phân nhỏ nhất (size optimization)
lto = true          # Link-Time Optimization toàn cục xuyên crate
codegen-units = 1   # Gom về 1 codegen unit để trình biên dịch optimize và inline triệt để
panic = "abort"     # Loại bỏ bảng stack unwinding không cần thiết
strip = true        # Tự động strip sạch toàn bộ debug symbol / symbols table
